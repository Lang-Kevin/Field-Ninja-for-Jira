<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Field Ninja for Jira — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Field Ninja for Jira — Settings</h1>
    <p class="jfv-subtitle">Manage which fields are hidden per site, project and issue type.</p>
    <label class="jfv-search-label" for="prefs-search">Search</label>
    <input id="prefs-search" class="jfv-search" type="search" placeholder="Host, project, issue type or field" />
    <div class="jfv-transfer-row">
      <button id="export-btn" type="button">Export</button>
      <label for="import-input">Import</label>
      <input id="import-input" type="file" accept="application/json" />
    </div>
    <p id="storage-usage" class="jfv-storage-usage"></p>
    <p id="storage-error" class="jfv-storage-error" role="alert" hidden></p>
    <p id="storage-status" class="jfv-storage-status" role="status" hidden></p>
    <div id="prefs-list"></div>
    <p id="prefs-no-match" hidden>No matches.</p>
    <button id="clear-all-btn" type="button">Clear All</button>
    <script src="options.js"></script>
  </body>
</html>
