<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Field Ninja for Jira</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Field Ninja for Jira</h1>
    <div id="settings-block" class="jfv-hidden">
      <label class="jfv-popup-row">
        <input type="checkbox" id="show-buttons-checkbox" />
        Show hide/unhide buttons on Jira field pages
      </label>
      <label class="jfv-popup-row">
        <input type="checkbox" id="debug-outline-checkbox" />
        Debug: Felder hervorheben
      </label>
    </div>
    <p id="status-message" class="jfv-popup-empty jfv-hidden"></p>
    <div id="scope-bar" class="jfv-scope-bar jfv-hidden">
      <span id="scope-label" class="jfv-scope-label"></span>
      <button id="activate-button" class="jfv-action-button jfv-primary" type="button"></button>
    </div>
    <div id="field-list"></div>
    <div id="field-button-row" class="jfv-button-row">
      <button id="hide-all-button" class="jfv-action-button" type="button">Hide all</button>
      <button id="show-all-button" class="jfv-action-button" type="button">Show all</button>
    </div>
    <button id="reset-all-button" class="jfv-reset-button" type="button">Reset all hidden fields</button>
    <script src="popup.js"></script>
  </body>
</html>
